[project]
name = "nfl-qb-bayesian"
version = "0.1.0"
description = "Hierarchical Bayesian shrinkage of PFF QB grades, informed by nflfastR snap/context data."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "nfl_data_py>=0.3.2",
    "pymc>=5.16",
    "arviz>=0.18",
    "streamlit>=1.37",
    "plotly>=5.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
